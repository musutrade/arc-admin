<div class="error-page">
  <div class="error-content">
    <!-- 错误卡片 -->
    <div class="error-card">
      <div class="error-illustration">
        <mat-icon class="illustration-icon">lock_reset</mat-icon>
        <div class="error-badge">
          <mat-icon class="filled">block</mat-icon>
        </div>
      </div>

      <h1 class="error-code">403</h1>
      <h2 class="error-title">Access Forbidden</h2>
      <p class="error-desc">
        Sorry, you do not have permission to access this page. This resource is restricted to
        specific administrative roles.
      </p>

      <div class="error-actions">
        <button class="btn-primary" (click)="goHome()">
          <mat-icon>arrow_back</mat-icon>
          Back to Home
        </button>
      </div>
    </div>
  </div>
</div>
