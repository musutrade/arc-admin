<div class="error-page n500">
  <div class="error-content n500-content">
    <!-- 插图 -->
    <div class="n500-illustration">
      <div class="n500-icon-wrap">
        <mat-icon class="filled">dangerous</mat-icon>
      </div>
    </div>

    <!-- 文案 -->
    <h1 class="error-code">500</h1>
    <h2 class="error-title">Internal Server Error</h2>
    <p class="error-desc">
      Something went wrong on our side. Please try again later or contact support if the issue
      persists. Our engineering team has been notified.
    </p>

    <!-- 操作 -->
    <div class="error-actions center">
      <button class="btn-primary" (click)="reload()">
        <mat-icon>refresh</mat-icon>
        Refresh Page
      </button>
      <button class="btn-outline" (click)="goHome()">
        <mat-icon>support_agent</mat-icon>
        Contact Support
      </button>
    </div>

    <!-- 状态信息 -->
    <div class="n500-status">
      <span>Status: <b class="critical">Critical</b></span>
      <span>Incident ID: <code class="incident-id">ERR-X92-RBAC</code></span>
      <a class="status-link">System Status Page</a>
    </div>
  </div>
</div>
