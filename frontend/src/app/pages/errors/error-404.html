<div class="error-page n404">
  <div class="error-content n404-content">
    <!-- 404 插图 -->
    <div class="n404-illustration">
      <div class="n404-ghost-text">404</div>
      <div class="n404-card">
        <mat-icon class="filled">qr_code_2</mat-icon>
        <div class="n404-error-badge">
          <mat-icon class="filled">error</mat-icon>
        </div>
      </div>
    </div>

    <!-- 文案 -->
    <div class="n404-text">
      <h2 class="error-title large">System Endpoint Not Found</h2>
      <p class="error-desc wide">
        The requested access control node or resource page does not exist. It might have been
        migrated, deleted, or you may have entered an incorrect path.
      </p>
    </div>

    <!-- Actions -->
    <div class="n404-panel">
      <div class="n404-buttons">
        <button class="btn-primary" (click)="goHome()">
          <mat-icon>home</mat-icon>
          Back to Dashboard
        </button>
        <button class="btn-secondary" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Previous Page
        </button>
      </div>
    </div>
  </div>
</div>
