<div class="error-page n404">
  <div class="error-content n404-content">
    <!-- 404 插图 -->
    <div class="n404-illustration">
      <div class="n404-ghost-text">404</div>
      <div class="n404-card">
        <mat-icon class="filled">qr_code_2</mat-icon>
        <div class="n404-error-badge">
          <mat-icon class="filled">error</mat-icon>
        </div>
      </div>
    </div>

    <!-- 文案 -->
    <div class="n404-text">
      <h2 class="error-title large">页面不存在</h2>
      <p class="error-desc wide">请求的页面不存在，可能已被移动、删除，或访问地址有误。</p>
    </div>

    <!-- Actions -->
    <div class="n404-panel">
      <div class="n404-buttons">
        <button class="btn-primary" (click)="goHome()">
          <mat-icon>home</mat-icon>
          返回首页
        </button>
        <button class="btn-secondary" (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          返回上一页
        </button>
      </div>
    </div>
  </div>
</div>
