<div class="login-page">
  <main class="login-card">
    <!-- Logo & Header -->
    <div class="login-header">
      <div class="logo-badge">
        <mat-icon class="filled">shield</mat-icon>
      </div>
      <h1>欢迎回来</h1>
      <p>请输入账号信息以登录 {{ appConfig.appName }}</p>
    </div>

    <!-- Login Card -->
    <div class="login-panel">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Username -->
        <div class="field">
          <label for="username">用户名</label>
          <div
            class="input-wrap"
            [class.input-error]="form.controls.username.touched && form.controls.username.invalid"
          >
            <mat-icon>person</mat-icon>
            <input
              id="username"
              type="text"
              formControlName="username"
              placeholder="请输入用户名"
              autocomplete="username"
            />
          </div>
          @if (form.controls.username.touched && form.controls.username.invalid) {
            <p class="field-error">请输入用户名</p>
          }
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">密码</label>
          <div
            class="input-wrap"
            [class.input-error]="form.controls.password.touched && form.controls.password.invalid"
          >
            <mat-icon>lock</mat-icon>
            <input
              id="password"
              [type]="hidePassword() ? 'password' : 'text'"
              formControlName="password"
              placeholder="请输入密码"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="eye-btn"
              (click)="togglePassword()"
              [attr.aria-label]="hidePassword() ? '显示密码' : '隐藏密码'"
            >
              <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </div>
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <p class="field-error">请输入密码</p>
          }
        </div>

        <!-- Error -->
        @if (error()) {
          <div class="login-error">
            <mat-icon>error</mat-icon>
            <span>{{ error() }}</span>
          </div>
        }

        <!-- Session preference -->
        <div class="login-options">
          <mat-checkbox formControlName="remember" color="primary">记住登录状态</mat-checkbox>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn" [disabled]="loading()">
          @if (loading()) {
            <mat-progress-spinner diameter="18" mode="indeterminate" />
            <span>正在登录...</span>
          } @else {
            <span>登录</span>
            <mat-icon>arrow_forward</mat-icon>
          }
        </button>
      </form>
    </div>
  </main>
</div>
