version = 1

[paths]
backend = "backend"
frontend = "frontend"
reports = "codex-audit-pipeline/.codex/reports"
tool_manifest = "codex-audit-pipeline/tools/arc-flow/Cargo.toml"
audit_config = "codex-audit-pipeline/.codex/audit.toml"

[doctor]
required_commands = ["git", "cargo", "rustc", "node", "npm"]
node_version_file = ".node-version"
hooks_path = "codex-audit-pipeline/hooks"

[database]
image = "postgres:16-alpine"
startup_timeout_secs = 30
container_port = 5432
user = "arc_admin_test"
password = "arc_admin_test"
name = "arc_admin_test"

[[scope.rules]]
patterns = ["backend/**"]
components = ["backend"]

[[scope.rules]]
patterns = ["frontend/**", ".node-version"]
components = ["frontend"]

[[scope.rules]]
patterns = ["rust-toolchain.toml"]
components = ["backend", "workflow"]

[[scope.rules]]
patterns = [
  "codex-audit-pipeline/tools/arc-flow/**",
  "codex-audit-pipeline/hooks/**",
  "codex-audit-pipeline/.codex/flow.toml",
  ".cargo/config.toml",
]
components = ["backend", "frontend", "workflow"]

[[scope.rules]]
patterns = ["docs/openapi.yaml", ".github/workflows/**"]
components = ["backend", "frontend", "workflow"]

[[scope.rules]]
patterns = [
  "codex-audit-pipeline/.codex/audit.toml",
  "codex-audit-pipeline/.codex/templates/**",
]
components = ["workflow"]

[[steps]]
id = "backend.format"
label = "backend format"
component = "backend"
profiles = ["full", "hook"]
program = "cargo"
args = ["fmt", "--manifest-path", "{backend}/Cargo.toml", "--", "--check"]
cwd = "{root}"
log = "backend_fmt.log"
timeout_secs = 180

[[steps]]
id = "backend.clippy"
label = "backend Clippy"
component = "backend"
profiles = ["full", "hook"]
program = "cargo"
args = [
  "clippy",
  "--manifest-path",
  "{backend}/Cargo.toml",
  "--locked",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
cwd = "{root}"
log = "backend_clippy.log"
timeout_secs = 180

[[steps]]
id = "backend.compile"
label = "backend compile"
component = "backend"
profiles = ["full"]
program = "cargo"
args = [
  "check",
  "--manifest-path",
  "{backend}/Cargo.toml",
  "--locked",
  "--all-targets",
]
cwd = "{root}"
log = "backend_check.log"
timeout_secs = 180

[[steps]]
id = "backend.tests"
label = "backend tests"
component = "backend"
profiles = ["full"]
program = "cargo"
args = [
  "test",
  "--manifest-path",
  "{backend}/Cargo.toml",
  "--locked",
  "--",
  "--nocapture",
]
cwd = "{root}"
log = "backend_tests.log"
timeout_secs = 120
timeout_env = "RUST_TEST_TIMEOUT"
parser = "rust"
requires_test_database = true

[[steps]]
id = "frontend.lint"
label = "frontend lint"
component = "frontend"
profiles = ["full", "hook"]
program = "npm"
args = [
  "exec",
  "--offline",
  "eslint",
  "--",
  "src",
  "--max-warnings=0",
]
cwd = "{frontend}"
log = "frontend_lint.log"
timeout_secs = 180

[[steps]]
id = "frontend.format"
label = "frontend format"
component = "frontend"
profiles = ["full", "hook"]
program = "npm"
args = ["run", "format:check"]
cwd = "{frontend}"
log = "frontend_format.log"
timeout_secs = 180

[[steps]]
id = "frontend.tests"
label = "frontend tests"
component = "frontend"
profiles = ["full"]
program = "npm"
args = ["test", "--", "--watch=false", "--runner=vitest"]
cwd = "{frontend}"
log = "frontend_tests.log"
timeout_secs = 180
timeout_env = "ANGULAR_TEST_TIMEOUT"
parser = "angular"

[[steps]]
id = "frontend.build"
label = "frontend production build"
component = "frontend"
profiles = ["full"]
program = "npm"
args = ["run", "build"]
cwd = "{frontend}"
log = "frontend_build.log"
timeout_secs = 180
timeout_env = "ANGULAR_BUILD_TIMEOUT"

[[steps]]
id = "workflow.hook-syntax"
label = "Git hook syntax"
component = "workflow"
profiles = ["full", "hook"]
program = "sh"
args = ["-n", "{root}/codex-audit-pipeline/hooks/pre-commit"]
cwd = "{root}"
log = "git_hook_syntax.log"
timeout_secs = 180

[[steps]]
id = "workflow.format"
label = "arc-flow format"
component = "workflow"
profiles = ["full", "hook"]
program = "cargo"
args = ["fmt", "--manifest-path", "{tool_manifest}", "--", "--check"]
cwd = "{root}"
log = "arc_flow_fmt.log"
timeout_secs = 180

[[steps]]
id = "workflow.clippy"
label = "arc-flow Clippy"
component = "workflow"
profiles = ["full"]
program = "cargo"
args = [
  "clippy",
  "--manifest-path",
  "{tool_manifest}",
  "--locked",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
cwd = "{root}"
log = "arc_flow_clippy.log"
timeout_secs = 180

[[steps]]
id = "workflow.tests"
label = "arc-flow tests"
component = "workflow"
profiles = ["full", "hook"]
program = "cargo"
args = [
  "test",
  "--manifest-path",
  "{tool_manifest}",
  "--locked",
  "--",
  "--nocapture",
]
cwd = "{root}"
log = "arc_flow_tests.log"
timeout_secs = 120
timeout_env = "RUST_TEST_TIMEOUT"
parser = "rust"
